<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>librus-synergia-cards dev harness</title>
<style>
  :root {
    --primary-text-color: #1d1b33;
    --secondary-text-color: #6b6885;
    --divider-color: #e1def2;
    --card-background-color: #ffffff;
    --ha-card-border-radius: 14px;
    --ha-card-box-shadow: 0 1px 2px rgba(29, 27, 51, 0.05), 0 6px 16px rgba(29, 27, 51, 0.08);
    color-scheme: light;
  }
  body.dark {
    --primary-text-color: #eeecfb;
    --secondary-text-color: #a9a5c8;
    --divider-color: #33304f;
    --card-background-color: #1c1a32;
    --ha-card-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding: 24px;
    background: #f3f1fb;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body.dark {
    background: #131226;
  }
  h1 {
    color: var(--primary-text-color);
    font-size: 1.1rem;
  }
  button#toggle,
  select#lang {
    margin-bottom: 20px;
    margin-right: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--divider-color);
    background: var(--card-background-color);
    color: var(--primary-text-color);
    cursor: pointer;
    font-family: inherit;
  }
  .section {
    color: var(--secondary-text-color);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 28px 0 10px;
  }
  /* Masonry/Pinterest-style packing (CSS columns) - a uniform grid leaves
     dead space under every card shorter than its row's tallest neighbor,
     which looks especially bad in a family with this much size variance
     (a lucky-number tile next to a scrollable message list). */
  .grid {
    column-count: 4;
    column-gap: 16px;
  }
  .grid > * {
    display: block;
    width: 100%;
    break-inside: avoid;
    margin-bottom: 16px;
  }
  @media (max-width: 1400px) {
    .grid { column-count: 3; }
  }
  @media (max-width: 1000px) {
    .grid { column-count: 2; }
  }
  @media (max-width: 640px) {
    .grid { column-count: 1; }
  }
</style>
</head>
<body>
  <h1>librus-synergia-cards dev harness (mock hass, no live HA needed)</h1>
  <button id="toggle" type="button">Toggle dark mode</button>
  <button id="outage" type="button">Symuluj awarię Librusa</button>
  <select id="lang">
    <option value="pl">Polski</option>
    <option value="en">English</option>
  </select>

  <div class="section">Wszystkie karty</div>
  <div class="grid" id="full"></div>

  <div class="section">Stany puste / błędy</div>
  <div class="grid" id="empty"></div>

  <!-- Real MDI glyph paths for the ha-icon stand-in below, so the harness
       (and the docs screenshots taken from it) match what Home Assistant
       renders. Offline subset - just the icons these cards actually use;
       regenerate with tools/gen-icons if a card starts using a new one. -->
  <script src="./icons.js"></script>

  <script type="module">
    // Minimal stand-ins for the real HA frontend elements this bundle
    // expects - this harness exists to verify each card's OWN data-binding
    // and layout logic against realistic mock data. Icons are proxied to
    // Iconify's MDI set so the rendered result matches Home Assistant.
    customElements.define(
      "ha-card",
      class extends HTMLElement {
        connectedCallback() {
          if (this.shadowRoot) return;
          const root = this.attachShadow({ mode: "open" });
          root.innerHTML = `
            <style>
              :host {
                display: block;
                background: var(--card-background-color);
                border-radius: var(--ha-card-border-radius, 14px);
                box-shadow: var(--ha-card-box-shadow);
                color: var(--primary-text-color);
              }
            </style>
            <slot></slot>
          `;
        }
      }
    );

    customElements.define(
      "ha-icon",
      class extends HTMLElement {
        static get observedAttributes() { return ["icon"]; }
        connectedCallback() { this._render(); }
        attributeChangedCallback() { this._render(); }
        _render() {
          if (!this.shadowRoot) this.attachShadow({ mode: "open" });
          const raw = this.getAttribute("icon") || "mdi:help-circle";
          const name = raw.replace(/^\w+:/, "");
          const body = (typeof MDI_ICONS !== "undefined" && MDI_ICONS[name]) || "";
          const label = name.slice(0, 2).toUpperCase();
          this.shadowRoot.innerHTML = body
            ? `
            <style>
              :host { display:inline-flex; align-items:center; justify-content:center; width:1em; height:1em; }
              svg { width:1em; height:1em; display:block; }
            </style>
            <svg viewBox="0 0 24 24" fill="currentColor">${body}</svg>
          `
            : `
            <style>
              :host { display:inline-flex; align-items:center; justify-content:center; width:1em; height:1em; font-size:20px; }
              .dot { width:100%; height:100%; border-radius:50%; background:currentColor; opacity:0.16; display:flex; align-items:center; justify-content:center; }
              .t { font-size:8px; font-weight:800; color:currentColor; }
            </style>
            <span class="dot"><span class="t">${label}</span></span>
          `;
        }
      }
    );

    customElements.define(
      "ha-select",
      class extends HTMLElement {
        connectedCallback() {
          this.style.display = "none"; // editors aren't exercised in this harness
        }
      }
    );
    customElements.define("ha-list-item", class extends HTMLElement {});

    // ---- Mock data (realistic values from the real account this session,
    // plus illustrative examples for endpoints that are still empty there -
    // see ha-librus-synergia/CLAUDE.md for exactly which is which). ----
    const DEVICE_ID = "dev1";
    const now = new Date();
    const today = new Date(now); today.setHours(0, 0, 0, 0);
    // BUG FIX (2026-09-06, found live): `d.toISOString().slice(0, 10)`
    // converts through UTC first - local midnight in a UTC+2 timezone
    // (Warsaw, September) is 22:00 the PREVIOUS day in UTC, so every
    // bare-date mock field built this way was silently one day too early
    // (caught via the lucky-number card showing "Na 6 wrz" for a mock
    // deliberately set to "tomorrow" while the harness's real wall-clock
    // date was the 6th - should have read "7 wrz"). Build the ISO string
    // from LOCAL year/month/day components instead, which is what every
    // call site here actually intends (a calendar DATE, not a UTC
    // instant) - matches the exact bug class already fixed twice this
    // session in the real backend/card code, this time in the dev
    // harness's own mock data.
    const iso = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };
    // Next Mon-Fri after `from` (skips the weekend) - for librus-tomorrow-card.
    const nextSchoolDay = (from) => { const d = new Date(from); d.setHours(0,0,0,0); d.setDate(d.getDate()+1); while (d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1); return d; };
    const tomorrowDay = nextSchoolDay(today);
    const tomorrowIso = iso(tomorrowDay);

    const SUBJECTS = [
      { id: 1, name: "Matematyka" },
      { id: 2, name: "Język polski" },
      { id: 3, name: "Biologia" },
      { id: 4, name: "Historia" },
      { id: 5, name: "Wychowanie fizyczne" },
      // The rest of a real 7th-grade subject list (2026-10-07) - long names
      // and three "Język ..." subjects are what broke the radar labels.
      { id: 6, name: "Język angielski" },
      { id: 7, name: "Język niemiecki" },
      { id: 8, name: "Chemia" },
      { id: 9, name: "Fizyka" },
      { id: 10, name: "Geografia" },
      { id: 11, name: "Plastyka" },
      { id: 12, name: "Muzyka" },
      { id: 13, name: "Edukacja zdrowotna" },
      { id: 14, name: "Zajęcia z wychowawcą" },
    ];

    const entities = {};
    const states = {};

    // Real HA state objects always carry last_updated/last_reported -
    // found live (librus-last-update-tile-card): this mock never set them,
    // so formatTimeAgo() correctly got `undefined` and rendered blank. A
    // fixed "4 minutes ago" for every entity, matching how one coordinator
    // poll updates every one of a device's sensors at once.
    const lastPolled = new Date(now.getTime() - 4 * 60_000).toISOString();

    function addEntity(entityId, translationKey, attrs, state) {
      entities[entityId] = { entity_id: entityId, device_id: DEVICE_ID, platform: "librus_synergia", translation_key: translationKey };
      states[entityId] = {
        entity_id: entityId,
        state: String(state),
        attributes: attrs,
        last_updated: lastPolled,
        last_reported: lastPolled,
        last_changed: lastPolled,
      };
    }

    // average_semester_2 kept a small (< 0.5) step above semester_1 so the
    // "Feniks" hero result stays inert in the default demo, matching the
    // real backend shape (both can be a genuine number, or null before a
    // semester has any counted grades yet) - see librus-hero-card.
    addEntity("sensor.overall_average", "overall_average", {
      average_semester_1: 4.5,
      average_semester_2: 4.8,
    }, "4.68");
    // New (2026-09-07): one status per calendar date, for the heatmap
    // card - mostly "good" school days over the last several weeks, with
    // one "bad" (matching last_absence_date below) and one "warn" thrown
    // in so all three colors are visible in the demo.
    const attendanceByDate = {};
    for (let i = 0; i < 60; i++) {
      const d = new Date(today.getTime() - i * 86400000);
      if (d.getDay() === 0 || d.getDay() === 6) continue; // weekends have no records
      attendanceByDate[iso(d)] = "good";
    }
    attendanceByDate[iso(new Date(today.getTime() - 18 * 86400000))] = "bad";
    attendanceByDate[iso(new Date(today.getTime() - 25 * 86400000))] = "warn";
    addEntity("sensor.attendance", "attendance", {
      // Includes a real excused absence ("Nieobecność uspr.") alongside a
      // still-open one ("Nieobecność") - confirmed live (2026-09-07) a
      // parent excusing a real absence via Librus reclassifies its type,
      // but the blended total looked identical either way until
      // unexcused_count/excused_count split them.
      breakdown: { "Obecność": 145, "Spóźnienie": 2, "Nieobecność": 1, "Nieobecność uspr.": 1 },
      presence_by_type: { "Obecność": true, "Spóźnienie": true, "Nieobecność": false, "Nieobecność uspr.": false },
      total_records: 149,
      unexcused_count: 1,
      excused_count: 1,
      by_date: attendanceByDate,
      // New (2026-09-07): excused/unexcused/late counts per ISO weekday,
      // for the weekday-breakdown chart card - matches the approved
      // mockup's illustrative numbers exactly.
      by_weekday: {
        "1": { excused: 0, unexcused: 0, late: 1 },
        "2": { excused: 0, unexcused: 1, late: 0 },
        "3": { excused: 1, unexcused: 0, late: 0 },
        "4": { excused: 0, unexcused: 0, late: 0 },
        "5": { excused: 0, unexcused: 1, late: 1 },
      },
      // New (ha-librus-synergia 0.8.0): same excused/unexcused/late split,
      // grouped by subject name instead - matches the approved mockup's
      // illustrative numbers exactly (librus-attendance-subject-card).
      by_subject: {
        "Chemia": { excused: 1, unexcused: 4, late: 0 },
        "Wychowanie fizyczne": { excused: 3, unexcused: 1, late: 0 },
        "Matematyka": { excused: 0, unexcused: 3, late: 1 },
        "Język angielski": { excused: 1, unexcused: 1, late: 0 },
        "Historia": { excused: 2, unexcused: 0, late: 0 },
        "Geografia": { excused: 0, unexcused: 1, late: 0 },
      },
      last_absence_date: iso(new Date(today.getTime() - 18 * 86400000)),
      percentage: 99.3,
      by_semester: {
        "1": { total: 149, present: 148, percentage: 99.3 },
        "2": { total: 0, present: 0, percentage: null },
      },
    }, 2);
    // "Lowest subject attendance" sensor (backend 0.9.0+) - one subject per
    // colour band, plus two with too few lessons (librus-subject-attendance-card).
    const subjAtt = {
      "Fizyka": [4, 10], "Wychowanie fizyczne": [11, 17], "Chemia": [8, 10], "Matematyka": [19, 20],
      "Język polski": [25, 25], "Język angielski": [15, 15], "Język niemiecki": [9, 9], "Biologia": [9, 9],
      "Geografia": [10, 10], "Historia": [9, 9], "Informatyka": [5, 5], "Muzyka": [5, 5], "Plastyka": [5, 5],
      "Zajęcia z wychowawcą": [10, 10], "Religia": [0, 2], "Edukacja zdrowotna": [3, 3],
    };
    const subjAttAttr = {};
    for (const [name, [present, total]] of Object.entries(subjAtt)) {
      subjAttAttr[name] = { total, present, absent: total - present, percentage: Math.round(present / total * 1000) / 10 };
    }
    addEntity("sensor.subject_attendance", "subject_attendance", {
      subject: "Fizyka", subjects: subjAttAttr, at_risk: ["Fizyka"],
    }, 40.0);
    // New (ha-librus-synergia 0.6.0): gamification sensors - streaks and a
    // cosmetic rank tier. attendance_streak intentionally matches
    // last_absence_date above (18 days) so librus-streak-card's
    // dedicated-sensor path and its old attribute-fallback path would
    // agree if compared side by side.
    addEntity("sensor.attendance_streak", "attendance_streak", {}, 18);
    addEntity("sensor.behaviour_streak", "behaviour_streak", {}, 42);
    addEntity("sensor.good_grade_streak", "good_grade_streak", {}, 7);
    addEntity("sensor.rank", "rank", { average: 4.68, points_to_next_tier: 0.32 }, "gold");
    // CONFIRMED live (2026-09-06): Librus can publish the NEXT school
    // day's number a day ahead - shown here exactly as observed live on
    // a Sunday (today has no school, "4" is actually Monday's number).
    addEntity("sensor.lucky_number", "lucky_number", {
      day: iso(new Date(today.getTime() + 1 * 86400000)),
      is_today: false,
    }, 4);
    // Weekly AI summary (integration 0.10+) - illustrative text from the
    // approved mockup, not a real student's data.
    const nextSunday = new Date(today.getTime() + ((7 - today.getDay()) % 7 || 7) * 86400000);
    nextSunday.setHours(18, 0, 0, 0);
    addEntity("sensor.weekly_summary", "weekly_summary", {
      status: "good",
      sections: {
        grades: { status: "good", text: "W tym tygodniu doszły 4 oceny: 5 z historii (sprawdzian, waga 3), 4 z biologii, 3+ z fizyki (kartkówka) i plus z plastyki. Średnia ogólna wzrosła z 4,30 do 4,38, głównie dzięki piątce z historii.\n\nFizyka (4,10) to jedyny przedmiot, w którym ostatnia ocena wypadła poniżej średniej. Przy jednej kartkówce to jeszcze nie trend, ale warto ją obserwować." },
        attendance: { status: "caution", text: "33 z 34 lekcji obecna. Jedna nieobecność w czwartek na muzyce, jeszcze nieusprawiedliwiona. Spóźnień brak." },
        behaviour: { status: "good", text: "Brak nowych uwag w tym tygodniu. 26 dni bez negatywnej uwagi i seria 5 ocen co najmniej dobrych z rzędu." },
        next_week: { status: "ok", text: "Wtorek 7.10: sprawdzian z matematyki (działy 1-2). Środa 8.10: zadanie z fizyki (s. 21). Czwartek 9.10: kartkówka z angielskiego. W piątek zastępstwo na WF." },
      },
      advice: [
        "Usprawiedliwić nieobecność z czwartku (muzyka).",
        "W niedzielę przejrzeć działy 1-2 z matematyki przed wtorkiem.",
        "Zapytać o kartkówkę z fizyki: nauczyciel wskazał błędy w jednostkach.",
      ],
      warning: "Nieobecność z czwartku (muzyka) jest wciąż nieusprawiedliwiona.",
      summary: null,
      week_from: iso(new Date(today.getTime() - 6 * 86400000)),
      week_to: iso(today),
      audience: "parent",
      generated_at: lastPolled,
      next_run: nextSunday.toISOString(),
      generating: false,
      paused: false,
      error: null,
    }, "Mocny tydzień z historii, fizyka do podciągnięcia przed sprawdzianem z matematyki.");
    entities["button.weekly_summary_generate"] = { entity_id: "button.weekly_summary_generate", device_id: DEVICE_ID, platform: "librus_synergia", translation_key: "weekly_summary_generate" };
    states["button.weekly_summary_generate"] = { entity_id: "button.weekly_summary_generate", state: lastPolled, attributes: {} };
    addEntity("sensor.unread_announcements", "unread_announcements", {
      recent: [
        { id: "LID-NBOARD-NOTICE-1", subject: "Kandydaci do Rady Samorządu Uczniowskiego", content: "Zgłoszenia przyjmujemy do końca miesiąca. Kandydaci powinni złożyć krótki opis swojego programu wyborczego u wychowawcy klasy najpóźniej do piątku.", start_date: iso(today), end_date: iso(new Date(today.getTime() + 29 * 86400000)), creation_date: iso(today) },
      ],
    }, 1);
    addEntity("sensor.behaviour_notices", "behaviour_notices", {
      recent: [
        { date: iso(new Date(today.getTime() - 3 * 86400000)), sentiment: "positive", category: "Praca na lekcji", text: "Aktywnie uczestniczył w dyskusji na lekcji przyrody." },
        { date: iso(new Date(today.getTime() - 8 * 86400000)), sentiment: "neutral", category: "Kultura osobista", text: "Zapomniał stroju na WF." },
      ],
    }, 2);
    addEntity("sensor.unread_messages", "unread_messages", {
      mailbox_breakdown: { inbox: 1, notes: 0, alerts: 1, substitutions: 1, absences: 0, justifications: 1, trash: 0 },
      recent: [
        { id: "100001", mailbox: "inbox", sender: "Nowak Anna", topic: "Zebranie z rodzicami", content: "Dzień dobry, zapraszam na zebranie z rodzicami w przyszłą środę o 17:00…", date: iso(new Date(today.getTime() - 2 * 86400000)), unread: true, has_attachment: false },
        { id: "100002", mailbox: "inbox", sender: "Zielińska Maria", topic: "Informacja dla rodziców", content: "Szanowni Państwo, w załączeniu przesyłam informację o organizacji roku szkolnego…", date: iso(new Date(today.getTime() - 3 * 86400000)), unread: false, has_attachment: true },
      ],
      substitutions_recent: [
        { id: "9001", mailbox: "substitutions", sender: "System zastępstw", topic: "Zmiana w planie lekcji", content: "Jutro (7 wrz) lekcja fizyki o 11:40 zostanie odwołana z powodu nieobecności nauczyciela…", date: iso(new Date(today.getTime() - 1 * 86400000)), unread: true, has_attachment: false },
      ],
      alerts_recent: [
        { id: "9002", mailbox: "alerts", sender: "Dyrekcja", topic: "Alert bezpieczeństwa", content: "Przypominamy o zasadach bezpieczeństwa podczas przerw międzylekcyjnych…", date: iso(new Date(today.getTime() - 4 * 86400000)), unread: true, has_attachment: false },
      ],
      // Mirrors a real submitted-but-not-yet-accepted excuse (2026-09-06,
      // user request: "wysłałem teraz usprawiedliwienie - jest
      // niezaakceptowane jeszcze").
      justifications_recent: [
        { id: "9003", mailbox: "justifications", sender: "Wychowawca", topic: "Usprawiedliwienie nieobecności", content: "Twoje usprawiedliwienie nieobecności z dnia 3 września oczekuje na akceptację wychowawcy.", date: iso(today), unread: true, has_attachment: false },
      ],
      // Sent messages and the archive (newer integration). Made-up people.
      outbox_recent: [
        { id: "9101", mailbox: "outbox", sender: "", receiver: "Nowak Anna", topic: "Pytanie o zebranie", content: "Dzień dobry, czy zebranie odbędzie się w sali 12?", date: iso(new Date(today.getTime() - 1 * 86400000)), unread: false, has_attachment: false, read_by: ["Anna Nowak"], read_count: 1, receivers_count: 1 },
        { id: "9102", mailbox: "outbox", sender: "", receiver: "Zielińska Maria", topic: "Nieobecność", content: "Zosia jutro będzie nieobecna z powodu wizyty u lekarza.", date: iso(new Date(today.getTime() - 5 * 86400000)), unread: false, has_attachment: false, read_by: [], read_count: 0, receivers_count: 1 },
      ],
      // Mailboxes this account doesn't have - the card hides their chips.
      missing_mailboxes: ["trash"],
      // Empty, so the Archive chip shows greyed out.
      archive_recent: [],
    }, 1);
    // Bell schedule built around the real wall-clock now so the
    // bell-schedule card always has a "current" period to highlight in the
    // demo, whatever time it's opened. 45-min slots, period 3 straddles now.
    const hm = (d) => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
    const bellSchedule = [];
    const bellSlots = [];
    for (let i = 0; i < 5; i++) {
      const s = new Date(now.getTime() + ((i - 2) * 55 - 15) * 60000);
      const e = new Date(s.getTime() + 45 * 60000);
      bellSchedule.push({ lesson_no: i + 1, start: hm(s), end: hm(e) });
      bellSlots.push({ start: s, end: e });
    }
    addEntity("sensor.school", "school", {
      town: "Przykładowo", street: "ul. Szkolna", head_teacher: "Ewa Wiśniewska", email: "sekretariat@example.edu.pl",
      bell_schedule: bellSchedule,
      // subject_teachers requires ha-librus-synergia 0.6.0+ - one subject
      // (Język niemiecki) has two teachers to demo the split-group case.
      subject_teachers: {
        "Matematyka": ["Joanna Lewandowska"],
        "Język polski": ["Katarzyna Wójcik"],
        "Biologia": ["K. Nowak"],
        "Historia": ["Agnieszka Kamińska"],
        "Wychowanie fizyczne": ["Piotr Mazur"],
        "Język niemiecki": ["Magdalena Zając", "Monika Szymańska"],
      },
    }, "Szkoła Podstawowa nr 1");
    addEntity("sensor.current_lesson", "current_lesson", {
      lesson_no: 3, start: bellSchedule[2].start, end: bellSchedule[2].end, minutes_left: 20,
      teacher: "K. Nowak", classroom: "sala 15", is_substitution: false,
    }, "Biologia");
    addEntity("sensor.next_lesson", "next_lesson", {
      lesson_no: 4, start: bellSchedule[3].start, end: bellSchedule[3].end, minutes_until: 40,
      date: iso(today), teacher: "A. Nowak", classroom: "sala 22", is_substitution: false,
    }, "Język polski");
    addEntity("sensor.next_exam", "next_exam", {
      days_until: Math.round((tomorrowDay.getTime() - today.getTime()) / 86400000),
      subject: "Matematyka", category: "Sprawdzian", content: "Dział 3 - ułamki dziesiętne",
      // Topics to revise (integration 0.12.1+): made-up lessons since the
      // previous test in the subject; one the student missed.
      topics: [
        { date: iso(new Date(today.getTime() - 15 * 86400000)), lesson_no: 2, topic: "Skracanie i rozszerzanie ułamków", absent: false },

      const events = [];
      let hour = 8, min = 0;

        const start = new Date(day); start.setHours(hour, min, 0, 0);
        const end = new Date(start.getTime() + 45 * 60000);
        events.push({

          location: `sala ${10 + i}`, description: "Nauczyciel " + String.fromCharCode(65 + i),

        min += 55; if (min >= 60) { min -= 60; hour += 1; }

    const isoWeekdayOf = (d) => { const w = d.getDay(); return w === 0 ? 7 : w; };

          start: start.toISOString(), end: end.toISOString(), allDay: false,
          summary: LESSON_SUBJECTS[(i + first + day.getDay()) % LESSON_SUBJECTS.length],
          location: `sala ${10 + i}`, description: "Nauczyciel " + String.fromCharCode(65 + i),

        ...weekdayEventsExToday,
        ...todayBellEvents,
        ...(tomorrowCovered ? [] : buildDayEvents(tomorrowDay, 5)),
      ],
      "calendar.agenda": [
        { start: iso(agendaStart), end: iso(new Date(agendaStart.getTime() + 86400000)), allDay: true, summary: "[Zebranie z Rodzicami] Zebranie z rodzicami. Organizacja roku szkolnego 2026/2027.", description: null },
        { start: iso(new Date(today.getTime() + 9 * 86400000)), end: iso(new Date(today.getTime() + 10 * 86400000)), allDay: true, summary: "[Sprawdzian] Matematyka: Ułamki dziesiętne, dział 2.", description: null },
      ],
      "calendar.free_days": [
        { start: iso(new Date(today.getTime() + 83 * 86400000)), end: iso(new Date(today.getTime() + 92 * 86400000)), allDay: true, summary: "Zimowa przerwa świąteczna" },
        { start: iso(new Date(today.getTime() + 150 * 86400000)), end: iso(new Date(today.getTime() + 151 * 86400000)), allDay: true, summary: "Dzień wolny od zajęć dydaktycznych" },
      ],
    };

    // Mocks GET history/period/... for librus-grade-trend-card - a plausible
    // stepped-upward series (average only changes when a real grade lands,
    // matching this integration's own thinning behaviour, not one point per poll).
    function buildMockGradeHistory(steps) {
      // Each [dayOffset, value] pair is dayOffset days BEFORE today.
      return steps.map(([daysAgo, value]) => ({
        state: String(value),
        last_changed: new Date(today.getTime() - daysAgo * 86400000).toISOString(),
      }));
    }
    const historyByEntity = {
      "sensor.overall_average": buildMockGradeHistory([
        [58, 4.1], [50, 4.1], [49, 4.25], [38, 4.25], [37, 4.4], [23, 4.4], [22, 4.55], [8, 4.55], [7, 4.68], [0, 4.68],
      ]),
      "sensor.subject_1_average": buildMockGradeHistory([
        [58, 4.5], [46, 4.5], [45, 4.8], [28, 4.8], [27, 5.0], [13, 5.0], [12, 4.9], [0, 4.9],
      ]),
    };

    const hass = {
      language: "pl",
      themes: { darkMode: false },
      devices: {
        [DEVICE_ID]: { id: DEVICE_ID, name: "E-dziennik Zosia Kowalska", config_entries: ["dev1_entry"] },
      },
      entities,
      states,
      localize: (key) => key,
      callApi: async (method, path) => {
        const calMatch = /^calendars\/([^?]+)\?start=([^&]+)&end=([^&]+)/.exec(path);
        if (calMatch) {
          const [, entityId, startEnc, endEnc] = calMatch;
          const rangeStart = new Date(decodeURIComponent(startEnc)).getTime();
          const rangeEnd = new Date(decodeURIComponent(endEnc)).getTime();
          const all = calendarEventsByEntity[entityId] ?? [];
          return all.filter((ev) => {
            const evStart = new Date(ev.allDay ? `${ev.start}T00:00:00` : ev.start).getTime();
            return evStart >= rangeStart && evStart < rangeEnd;
          });
        }
        const historyMatch = /^history\/period\/[^?]+\?filter_entity_id=([^&]+)/.exec(path);
        if (historyMatch) {
          const entityId = decodeURIComponent(historyMatch[1]);
          return [historyByEntity[entityId] ?? []];
        }
        return [];
      },
      // Mocks librus_synergia.get_message (see utils/services.ts) with
      // made-up messages - never put real people's data in this file.
      // Mocks the AI summary card's "Generate now" (button.press).
      callService: async (domain, service, data) => {
        if (domain === "todo" && service === "update_item") {
          if (data.status === "completed") window.__todoDone.add(String(data.item));
          else window.__todoDone.delete(String(data.item));
          return;
        }
        await new Promise((resolve) => setTimeout(resolve, 900));
      },
      // Attachment endpoints (message and homework files): a tiny made-up text file.
      fetchWithAuth: async (path) => {
        await new Promise((resolve) => setTimeout(resolve, 400));
        return new Response("Przykładowy załącznik (dev harness)", {
          headers: { "Content-Type": "text/plain", "Content-Disposition": "attachment; filename*=UTF-8''informacja-dla-rodzicow.txt" },
        });
      },
      callWS: async (msg) => {
        if (msg.type === "todo/item/list") {
          return {
            items: ["101", "102", "103"].map((uid) => ({
              uid,
              summary: uid,
              status: window.__todoDone.has(uid) ? "completed" : "needs_action",
            })),
          };
        }
        if (msg.type === "call_service" && msg.domain === "librus_synergia" && msg.service === "get_message") {
          await new Promise((resolve) => setTimeout(resolve, 500));
          const fullContentByKey = {
            "inbox:100001": {
              sender: "Nowak Anna",
              topic: "Zebranie z rodzicami",
              content: "Dzień dobry,\nzapraszam na zebranie z rodzicami w przyszłą środę o godz. 17:00.\n\nOmówimy plan pracy na rok szkolny i sprawy organizacyjne klasy.\n\nZ wyrazami szacunku,\nAnna Nowak",
            },
            // Attachments field shape (integration 0.7.2+); the filename and
            // text are made up.
            "inbox:100002": {
              sender: "Zielińska Maria",
              topic: "Informacja dla rodziców",
              content: "Szanowni Państwo,\nw załączeniu przesyłam informację o organizacji roku szkolnego.\nZachęcam do zapoznania się z materiałami.\n\nZ poważaniem,\nMaria Zielińska",
              has_attachment: true,
              attachments: [{ id: "500001", filename: "informacja-dla-rodzicow.pdf" }],
            },
            "substitutions:9001": {
              sender: "System zastępstw",
              topic: "Zmiana w planie lekcji",
              content: "Jutro (7 wrz) lekcja fizyki o 11:40 zostanie odwołana z powodu nieobecności nauczyciela.\n\nUczniowie klasy 7d w tym czasie mają zajęcia świetlicowe w sali 15.",
            },
            "alerts:9002": {
              sender: "Dyrekcja",
              topic: "Alert bezpieczeństwa",
              content: "Przypominamy o zasadach bezpieczeństwa podczas przerw międzylekcyjnych - zakaz biegania po korytarzach i klatkach schodowych.\n\nProsimy o przypomnienie dzieciom tych zasad w domu.",
            },
            "justifications:9003": {
              sender: "Wychowawca",
              topic: "Usprawiedliwienie nieobecności",
              content: "Twoje usprawiedliwienie nieobecności z dnia 3 września zostało złożone i oczekuje na akceptację wychowawcy.\n\nStatus: OCZEKUJE",
            },
          };
          const key = `${msg.service_data.mailbox ?? "inbox"}:${msg.service_data.message_id}`;
          const picked = fullContentByKey[key] ?? fullContentByKey["inbox:100001"];
          return {
            response: {
              id: msg.service_data.message_id,
              mailbox: msg.service_data.mailbox ?? "inbox",
              send_date: iso(new Date(today.getTime() - 2 * 86400000)),
              read_date: iso(today),
              has_attachment: false,
              ...picked,
            },
          };
        }
        return {};
      },
      // Mocks the event-bus subscription librus-achievements-card uses
      // (no sensor holds achievement HISTORY - only the raw
      // librus_synergia_achievement_unlocked bus event does) - fires two
      // demo achievements shortly after mount so the gallery shows a
      // populated trophy case rather than always the empty state.
      connection: {
        subscribeEvents: async (callback, eventType) => {
          if (eventType === "librus_synergia_achievement_unlocked") {
            setTimeout(() => callback({ data: { entry_id: "dev1_entry", id: "first_six", title: "Pierwsza szóstka!" } }), 300);
            setTimeout(
              () => callback({ data: { entry_id: "dev1_entry", id: "attendance_streak_7", title: "Tydzień bez nieobecności" } }),
              600
            );
          }
          return () => {};
        },
      },
    };

    const emptyHass = {
      ...hass,
      entities: {},
      states: {},
      devices: {},
      callApi: async () => [],
    };

    const FULL_CARDS = [
      "librus-grades-card", "librus-grade-log-card",
      "librus-lesson-topics-card",
      "librus-school-trips-card",
      "librus-exam-prep-card",
      "librus-school-documents-card",
      "librus-justifications-card",
      "librus-catch-up-card",
      { tag: "librus-subject-grades-card", config: { type: "custom:librus-subject-grades-card", subject_id: 1 } },
      "librus-grade-trend-card",
      { tag: "librus-grade-trend-card", config: { type: "custom:librus-grade-trend-card", subject_id: 1 } },
      { tag: "librus-grade-goal-card", config: { type: "custom:librus-grade-goal-card", target: 5.0 } },
      { tag: "librus-grade-goal-card", config: { type: "custom:librus-grade-goal-card", subject_id: 1, target: 4.5 } },
      { tag: "librus-grade-simulator-card", config: { type: "custom:librus-grade-simulator-card", subject_id: 2 } },
      "librus-semester-comparison-card",
      "librus-grade-distribution-card",
      "librus-grades-radar-card", "librus-grade-category-distribution-card",
      "librus-latest-grade-card", "librus-behaviour-grade-card", "librus-descriptive-grades-card",
      "librus-subject-spotlight-card", "librus-report-card-card",
      "librus-attendance-card", "librus-attendance-tile-card", "librus-attendance-heatmap-card",
      "librus-attendance-weekday-card", "librus-attendance-subject-card", "librus-subject-attendance-card", "librus-school-day-card",
      "librus-behaviour-notices-card", "librus-behaviour-notices-tile-card",
      "librus-messages-card", "librus-messages-tile-card",
      "librus-substitutions-card",
      "librus-announcements-card", "librus-announcements-tile-card",
      "librus-homework-assignments-card", "librus-homework-checklist-card", "librus-recent-activity-card",
      "librus-today-lessons-card", "librus-next-lesson-tile-card", "librus-agenda-card",
      "librus-exam-countdown-card",
      "librus-free-days-card", "librus-free-days-tile-card", "librus-week-timetable-card",
      "librus-bell-schedule-card",
      "librus-subject-time-card", "librus-school-card",
      "librus-school-year-card",
      "librus-today-card", "librus-tomorrow-card",
      { tag: "librus-first-lesson-card", family: true },
      { tag: "librus-first-lesson-card", family: true, config: { type: "custom:librus-first-lesson-card", only_tomorrow: true, hide_room: true, title: "Jutro rano" } },
      "librus-week-summary-card", "librus-lucky-number-card",
      "librus-student-card", "librus-streak-card", "librus-rank-card", "librus-achievements-card",
      "librus-teachers-card", "librus-level-card",
      { tag: "librus-hero-card", config: { type: "custom:librus-hero-card" } },
      { tag: "librus-hero-card", config: { type: "custom:librus-hero-card", mode: "hero" } },
      { tag: "librus-hero-stats-card", config: { type: "custom:librus-hero-stats-card" } },
      { tag: "librus-hero-history-card", config: { type: "custom:librus-hero-history-card" } },
      { tag: "librus-last-update-tile-card", config: { type: "custom:librus-last-update-tile-card" } },
      { tag: "librus-ai-summary-card", config: { type: "custom:librus-ai-summary-card" } },
      { tag: "librus-ai-summary-card", config: { type: "custom:librus-ai-summary-card", summary_only: true, title: "Tydzień (tylko rady)" } },
      { tag: "librus-grade-log-card", config: { type: "custom:librus-grade-log-card", title: "Tylko sprawdziany (filtr)", category_filter: "sprawdzian", sort: "oldest" } },
      { tag: "librus-grade-log-card", config: { type: "custom:librus-grade-log-card", title: "Z ocenami opisowymi", show_descriptive: true, days: 3 } },
      { tag: "librus-rank-card", config: { type: "custom:librus-rank-card", compact: true } },
    ];

    // Two more students for librus-first-lesson-card (issue #6), in their own
    // hass object: with several devices, every single-student card rightly
    // asks which student to show, so the shared `hass` keeps just one.
    const FAMILY = [
      { id: "dev_ala", name: "E-dziennik Ala Nowicka",
        today: [["07:10", "07:55", "Wychowanie fizyczne", "sala gim."], ["08:00", "08:45", "Język polski", "s. 21"]],
        next: [["07:10", "07:55", "Matematyka", "s. 21"], ["08:00", "08:45", "Przyroda", "s. 3"]] },
      { id: "dev_ola", name: "E-dziennik Ola Wiśniewska",
        today: [],
        next: [["08:00", "08:45", "Matematyka (odwołane)", "s. 7"], ["08:55", "09:40", "Język angielski (zastępstwo)", "s. 7"]] },
    ];
    const familyEntities = { ...entities };
    const familyStates = { ...states };
    const familyDevices = { ...hass.devices };
    const familyCalendars = {};
    for (const kid of FAMILY) {
      const entityId = `calendar.timetable_${kid.id}`;
      familyDevices[kid.id] = { id: kid.id, name: kid.name, config_entries: [`${kid.id}_entry`] };
      familyEntities[entityId] = { entity_id: entityId, device_id: kid.id, platform: "librus_synergia", translation_key: "timetable" };
      familyStates[entityId] = { entity_id: entityId, state: "off", attributes: {}, last_updated: lastPolled, last_reported: lastPolled, last_changed: lastPolled };
      const toEvents = (day, rows) => rows.map(([from, to, summary, room]) => ({
        start: `${iso(day)}T${from}:00`, end: `${iso(day)}T${to}:00`, allDay: false, summary, location: room,
      }));
      familyCalendars[entityId] = [...toEvents(today, kid.today), ...toEvents(tomorrowDay, kid.next)];
    }
    const familyHass = {
      ...hass,
      devices: familyDevices,
      entities: familyEntities,
      states: familyStates,
      callApi: async (method, path) => {
        const m = /^calendars\/([^?]+)\?start=([^&]+)&end=([^&]+)/.exec(path);
        if (m && familyCalendars[m[1]]) {
          const from = new Date(decodeURIComponent(m[2])).getTime();
          const to = new Date(decodeURIComponent(m[3])).getTime();
          return familyCalendars[m[1]].filter((ev) => { const t = new Date(ev.start).getTime(); return t >= from && t < to; });
        }
        return hass.callApi(method, path);
      },
    };

    function mountCard(container, tag, hassObj, config) {
      const el = document.createElement(tag);
      el.setConfig(config || { type: `custom:${tag}` });
      el.hass = hassObj;
      container.appendChild(el);
      return el;
    }

    // Seed a few past results for librus-hero-history-card - the real card
    // only ever grows this list going forward from whenever it's first
    // added (same limitation as achievements-card), so an empty demo
    // browser would otherwise only ever show the empty state or, at best,
    // the one entry the live librus-hero-card mounts below would write on
    // their own first render.
    try {
      window.localStorage.setItem(
        `librus-hero-history:${DEVICE_ID}`,
        JSON.stringify([
          { id: "wszechstronny", when: iso(new Date(today.getTime() - 21 * 86400000)) },
          { id: "wojownik", when: iso(new Date(today.getTime() - 9 * 86400000)) },
        ])
      );
    } catch {}

    import("../dist/librus-synergia-cards.js").then(() => {
      const fullGrid = document.getElementById("full");
      const cardEls = [];
      for (const entry of FULL_CARDS) {
        const tag = typeof entry === "string" ? entry : entry.tag;
        const config = typeof entry === "string" ? undefined : entry.config;
        cardEls.push(mountCard(fullGrid, tag, entry.family ? familyHass : hass, config));
      }

      const emptyGrid = document.getElementById("empty");
      const emptyEls = [];
      for (const entry of FULL_CARDS) {
        const tag = typeof entry === "string" ? entry : entry.tag;
        const config = typeof entry === "string" ? undefined : entry.config;
        emptyEls.push(mountCard(emptyGrid, tag, emptyHass, config));
      }

      document.getElementById("toggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        hass.themes.darkMode = document.body.classList.contains("dark");
        emptyHass.themes.darkMode = hass.themes.darkMode;
        [...cardEls, ...emptyEls].forEach((el) => { el.hass = { ...el.hass, themes: { darkMode: hass.themes.darkMode } }; });
      });
      let outage = false;
      document.getElementById("outage").addEventListener("click", (e) => {
        outage = !outage;
        e.target.textContent = outage ? "Librus znowu działa" : "Symuluj awarię Librusa";
        const since = outage ? new Date(Date.now() - 260 * 60_000).toISOString() : new Date().toISOString();
        const next = new Date(Date.now() + 40 * 60_000).toISOString();
        hass.states["sensor.status"] = {
          ...hass.states["sensor.status"],
          state: outage ? "stale" : "ok",
          attributes: { ...hass.states["sensor.status"].attributes, data_source: outage ? "stale" : "live", last_success: since, failures: outage ? 3 : 0, next_attempt: outage ? next : null },
        };
        hass.states["sensor.last_update"] = { ...hass.states["sensor.last_update"], state: since };
        hass.states = { ...hass.states };
        cardEls.forEach((el) => { el.hass = { ...el.hass, states: hass.states }; });
      });
      document.getElementById("lang").addEventListener("change", (e) => {
        hass.language = e.target.value;
        emptyHass.language = e.target.value;
        cardEls.forEach((el) => { el.hass = { ...el.hass, language: e.target.value }; });
      });
    });
  </script>
</body>
</html>
