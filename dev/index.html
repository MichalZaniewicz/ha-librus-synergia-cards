<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>librus-synergia-cards dev harness</title>
<style>
  :root {
    --primary-text-color: #1d1b33;
    --secondary-text-color: #6b6885;
    --divider-color: #e1def2;
    --card-background-color: #ffffff;
    --ha-card-border-radius: 14px;
    --ha-card-box-shadow: 0 1px 2px rgba(29, 27, 51, 0.05), 0 6px 16px rgba(29, 27, 51, 0.08);
    color-scheme: light;
  }
  body.dark {
    --primary-text-color: #eeecfb;
    --secondary-text-color: #a9a5c8;
    --divider-color: #33304f;
    --card-background-color: #1c1a32;
    --ha-card-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding: 24px;
    background: #f3f1fb;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body.dark {
    background: #131226;
  }
  h1 {
    color: var(--primary-text-color);
    font-size: 1.1rem;
  }
  button#toggle,
  select#lang {
    margin-bottom: 20px;
    margin-right: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--divider-color);
    background: var(--card-background-color);
    color: var(--primary-text-color);
    cursor: pointer;
    font-family: inherit;
  }
  .section {
    color: var(--secondary-text-color);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 28px 0 10px;
  }
  /* Masonry/Pinterest-style packing (CSS columns) - a uniform grid leaves
     dead space under every card shorter than its row's tallest neighbor,
     which looks especially bad in a family with this much size variance
     (a lucky-number tile next to a scrollable message list). */
  .grid {
    column-count: 4;
    column-gap: 16px;
  }
  .grid > * {
    display: block;
    width: 100%;
    break-inside: avoid;
    margin-bottom: 16px;
  }
  @media (max-width: 1400px) {
    .grid { column-count: 3; }
  }
  @media (max-width: 1000px) {
    .grid { column-count: 2; }
  }
  @media (max-width: 640px) {
    .grid { column-count: 1; }
  }
</style>
</head>
<body>
  <h1>librus-synergia-cards dev harness (mock hass, no live HA needed)</h1>
  <button id="toggle" type="button">Toggle dark mode</button>
  <button id="outage" type="button">Symuluj awarię Librusa</button>
  <select id="lang">
    <option value="pl">Polski</option>
    <option value="en">English</option>
  </select>

  <div class="section">Wszystkie karty</div>
  <div class="grid" id="full"></div>

  <div class="section">Stany puste / błędy</div>
  <div class="grid" id="empty"></div>

  <!-- Real MDI glyph paths for the ha-icon stand-in below, so the harness
       (and the docs screenshots taken from it) match what Home Assistant
       renders. Offline subset - just the icons these cards actually use;
       regenerate with tools/gen-icons if a card starts using a new one. -->
  <script src="./icons.js"></script>

  <script type="module">
    // Minimal stand-ins for the real HA frontend elements this bundle
    // expects - this harness exists to verify each card's OWN data-binding
    // and layout logic against realistic mock data. Icons are proxied to
    // Iconify's MDI set so the rendered result matches Home Assistant.
    customElements.define(
      "ha-card",
      class extends HTMLElement {
        connectedCallback() {
          if (this.shadowRoot) return;
          const root = this.attachShadow({ mode: "open" });
          root.innerHTML = `
            <style>
              :host {
                display: block;
                background: var(--card-background-color);
                border-radius: var(--ha-card-border-radius, 14px);
                box-shadow: var(--ha-card-box-shadow);
                color: var(--primary-text-color);
              }
            </style>
            <slot></slot>
          `;
        }
      }
    );

    customElements.define(
      "ha-icon",
      class extends HTMLElement {
        static get observedAttributes() { return ["icon"]; }
        connectedCallback() { this._render(); }
        attributeChangedCallback() { this._render(); }
        _render() {
          if (!this.shadowRoot) this.attachShadow({ mode: "open" });
          const raw = this.getAttribute("icon") || "mdi:help-circle";
          const name = raw.replace(/^\w+:/, "");
          const body = (typeof MDI_ICONS !== "undefined" && MDI_ICONS[name]) || "";
          const label = name.slice(0, 2).toUpperCase();
          this.shadowRoot.innerHTML = body
            ? `
            <style>
              :host { display:inline-flex; align-items:center; justify-content:center; width:1em; height:1em; }
              svg { width:1em; height:1em; display:block; }
            </style>
            <svg viewBox="0 0 24 24" fill="currentColor">${body}</svg>
          `
            : `
            <style>
              :host { display:inline-flex; align-items:center; justify-content:center; width:1em; height:1em; font-size:20px; }
              .dot { width:100%; height:100%; border-radius:50%; background:currentColor; opacity:0.16; display:flex; align-items:center; justify-content:center; }
              .t { font-size:8px; font-weight:800; color:currentColor; }
            </style>
            <span class="dot"><span class="t">${label}</span></span>
          `;
        }
      }
    );

    customElements.define(
      "ha-select",
      class extends HTMLElement {
        connectedCallback() {
          this.style.display = "none"; // editors aren't exercised in this harness
        }
      }
    );
    customElements.define("ha-list-item", class extends HTMLElement {});

    // ---- Mock data (realistic values from the real account this session,
    // plus illustrative examples for endpoints that are still empty there -
    // see ha-librus-synergia/CLAUDE.md for exactly which is which). ----
    const DEVICE_ID = "dev1";
    const now = new Date();
    const today = new Date(now); today.setHours(0, 0, 0, 0);
    // BUG FIX (2026-09-06, found live): `d.toISOString().slice(0, 10)`
    // converts through UTC first - local midnight in a UTC+2 timezone
    // (Warsaw, September) is 22:00 the PREVIOUS day in UTC, so every
    // bare-date mock field built this way was silently one day too early
    // (caught via the lucky-number card showing "Na 6 wrz" for a mock
    // deliberately set to "tomorrow" while the harness's real wall-clock
    // date was the 6th - should have read "7 wrz"). Build the ISO string
    // from LOCAL year/month/day components instead, which is what every
    // call site here actually intends (a calendar DATE, not a UTC
    // instant) - matches the exact bug class already fixed twice this
    // session in the real backend/card code, this time in the dev
    // harness's own mock data.
    const iso = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };
    // Next Mon-Fri after `from` (skips the weekend) - for librus-tomorrow-card.
    const nextSchoolDay = (from) => { const d = new Date(from); d.setHours(0,0,0,0); d.setDate(d.getDate()+1); while (d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1); return d; };
    const tomorrowDay = nextSchoolDay(today);
    const tomorrowIso = iso(tomorrowDay);

    const SUBJECTS = [
      { id: 1, name: "Matematyka" },
      { id: 2, name: "Język polski" },
      { id: 3, name: "Biologia" },
      { id: 4, name: "Historia" },
      { id: 5, name: "Wychowanie fizyczne" },
      // The rest of a real 7th-grade subject list (2026-10-07) - long names
      // and three "Język ..." subjects are what broke the radar labels.
      { id: 6, name: "Język angielski" },
      { id: 7, name: "Język niemiecki" },
      { id: 8, name: "Chemia" },
      { id: 9, name: "Fizyka" },
      { id: 10, name: "Geografia" },
      { id: 11, name: "Plastyka" },
      { id: 12, name: "Muzyka" },
      { id: 13, name: "Edukacja zdrowotna" },
      { id: 14, name: "Zajęcia z wychowawcą" },
    ];

    const entities = {};
    const states = {};

    // Real HA state objects always carry last_updated/last_reported -
    // found live (librus-last-update-tile-card): this mock never set them,
    // so formatTimeAgo() correctly got `undefined` and rendered blank. A
    // fixed "4 minutes ago" for every entity, matching how one coordinator
    // poll updates every one of a device's sensors at once.
    const lastPolled = new Date(now.getTime() - 4 * 60_000).toISOString();

    function addEntity(entityId, translationKey, attrs, state) {
      entities[entityId] = { entity_id: entityId, device_id: DEVICE_ID, platform: "librus_synergia", translation_key: translationKey };
      states[entityId] = {
        entity_id: entityId,
        state: String(state),
        attributes: attrs,
        last_updated: lastPolled,
        last_reported: lastPolled,
        last_changed: lastPolled,
      };
    }

    // average_semester_2 kept a small (< 0.5) step above semester_1 so the
    // "Feniks" hero result stays inert in the default demo, matching the
    // real backend shape (both can be a genuine number, or null before a
    // semester has any counted grades yet) - see librus-hero-card.
    // semester_summary (backend 0.12.25+) for librus-semester-card - made-up
    // numbers for the first semester, counted up to today.
    const semesterStart = new Date(2026, 8, 1);
    const semesterEnd = new Date(2027, 0, 31);
    const semesterDays = Math.round((semesterEnd - semesterStart) / 86400000) + 1;
    const semesterElapsed = Math.max(1, Math.min(semesterDays, Math.round((today - semesterStart) / 86400000) + 1));
    const averageSeries = [4.10, 4.25, 4.20, 4.38, 4.31, 4.44, 4.40, 4.52, 4.49, 4.58, 4.62].map((v, i, all) => [
      iso(new Date(today.getTime() - (all.length - 1 - i) * 7 * 86400000)), v,
    ]);
    addEntity("sensor.overall_average", "overall_average", {
      average_semester_1: 4.5,
      average_semester_2: 4.8,
      average_mode: "weighted",
      semester_summary: {
        current: 1,
        library_books: 3,
        semesters: {
          "1": {
            semester: 1, start: iso(semesterStart), end: iso(semesterEnd),
            days: semesterDays, days_elapsed: semesterElapsed, progress: semesterElapsed / semesterDays, finished: false,
            grades: {
              count: 34, distribution: { "1": 1, "2": 2, "3": 5, "4": 8, "5": 12, "6": 6 }, most_common: 5,
              sixes: 6, ones: 1, plus: 5, minus: 1, tests: 6, tests_average: 4.33, corrections: 2, with_comments: 7,
              per_week: 4.3, average: 4.62, average_change: 0.18, average_series: averageSeries,
              best_week: { start: iso(new Date(today.getTime() - 7 * 86400000)), average: 5.67, count: 3 },
              busiest_day: { date: iso(new Date(today.getTime() - 12 * 86400000)), count: 4 },
            },
            subjects: [
              ["Biologia", 5.40, 5], ["Plastyka", 5.33, 3], ["Język angielski", 5.00, 6], ["Historia", 4.75, 4],
              ["Język polski", 4.60, 5], ["Geografia", 4.50, 4], ["Fizyka", 3.80, 4], ["Matematyka", 3.25, 6],
            ].map(([subject, average, count]) => ({ subject, average, count })),
            attendance: {
              records: 182, present: 175, percentage: 96.1, absences: 7, excused: 7, unexcused: 0, late: 2,
              absences_by_weekday: [3, 1, 0, 2, 1], last_absence: iso(new Date(today.getTime() - 23 * 86400000)),
            },
            lessons: { held: 182, cancelled: 12, substitutions: 19 },
            notes: { positive: 3, negative: 1, neutral: 0 },
            homework: 18,
            exams: { done: 6, upcoming: 4 },
            trips: 1,
            badges: 5,
            latest_badge: "Hat-trick",
          },
        },
      },
    }, "4.68");
    // New (2026-09-07): one status per calendar date, for the heatmap
    // card - mostly "good" school days over the last several weeks, with
    // one "bad" (matching last_absence_date below) and one "warn" thrown
    // in so all three colors are visible in the demo.
    const attendanceByDate = {};
    for (let i = 0; i < 60; i++) {
      const d = new Date(today.getTime() - i * 86400000);
      if (d.getDay() === 0 || d.getDay() === 6) continue; // weekends have no records
      attendanceByDate[iso(d)] = "good";
    }
    attendanceByDate[iso(new Date(today.getTime() - 18 * 86400000))] = "bad";
    attendanceByDate[iso(new Date(today.getTime() - 25 * 86400000))] = "warn";
    addEntity("sensor.attendance", "attendance", {
      // Includes a real excused absence ("Nieobecność uspr.") alongside a
      // still-open one ("Nieobecność") - confirmed live (2026-09-07) a
      // parent excusing a real absence via Librus reclassifies its type,
      // but the blended total looked identical either way until
      // unexcused_count/excused_count split them.
      breakdown: { "Obecność": 145, "Spóźnienie": 2, "Nieobecność": 1, "Nieobecność uspr.": 1 },
      presence_by_type: { "Obecność": true, "Spóźnienie": true, "Nieobecność": false, "Nieobecność uspr.": false },
      total_records: 149,
      unexcused_count: 1,
      excused_count: 1,
      by_date: attendanceByDate,
      // New (2026-09-07): excused/unexcused/late counts per ISO weekday,
      // for the weekday-breakdown chart card - matches the approved
      // mockup's illustrative numbers exactly.
      by_weekday: {
        "1": { excused: 0, unexcused: 0, late: 1 },
        "2": { excused: 0, unexcused: 1, late: 0 },
        "3": { excused: 1, unexcused: 0, late: 0 },
        "4": { excused: 0, unexcused: 0, late: 0 },
        "5": { excused: 0, unexcused: 1, late: 1 },
      },
      // New (ha-librus-synergia 0.8.0): same excused/unexcused/late split,
      // grouped by subject name instead - matches the approved mockup's
      // illustrative numbers exactly (librus-attendance-subject-card).
      by_subject: {
        "Chemia": { excused: 1, unexcused: 4, late: 0 },
        "Wychowanie fizyczne": { excused: 3, unexcused: 1, late: 0 },
        "Matematyka": { excused: 0, unexcused: 3, late: 1 },
        "Język angielski": { excused: 1, unexcused: 1, late: 0 },
        "Historia": { excused: 2, unexcused: 0, late: 0 },
        "Geografia": { excused: 0, unexcused: 1, late: 0 },
      },
      last_absence_date: iso(new Date(today.getTime() - 18 * 86400000)),
      percentage: 99.3,
      by_semester: {
        "1": { total: 149, present: 148, percentage: 99.3 },
        "2": { total: 0, present: 0, percentage: null },
      },
    }, 2);
    // "Lowest subject attendance" sensor (backend 0.9.0+) - one subject per
    // colour band, plus two with too few lessons (librus-subject-attendance-card).
    const subjAtt = {
      "Fizyka": [4, 10], "Wychowanie fizyczne": [11, 17], "Chemia": [8, 10], "Matematyka": [19, 20],
      "Język polski": [25, 25], "Język angielski": [15, 15], "Język niemiecki": [9, 9], "Biologia": [9, 9],
      "Geografia": [10, 10], "Historia": [9, 9], "Informatyka": [5, 5], "Muzyka": [5, 5], "Plastyka": [5, 5],
      "Zajęcia z wychowawcą": [10, 10], "Religia": [0, 2], "Edukacja zdrowotna": [3, 3],
    };
    const subjAttAttr = {};
    for (const [name, [present, total]] of Object.entries(subjAtt)) {
      subjAttAttr[name] = { total, present, absent: total - present, percentage: Math.round(present / total * 1000) / 10 };
    }
    // Absences still allowed this semester (integration 0.12.22+, made up).
    const leftBy = { Fizyka: -1, Religia: 2, "Wychowanie fizyczne": 3 };
    const absenceBudget = {};
    for (const name of Object.keys(subjAttAttr)) {
      const left = leftBy[name] ?? 5 + (name.length % 7);
      absenceBudget[name] = { left, absent: subjAttAttr[name].absent, allowed: subjAttAttr[name].absent + left, held: subjAttAttr[name].total, remaining: 30 };
    }
    addEntity("sensor.subject_attendance", "subject_attendance", {
      subject: "Fizyka", subjects: subjAttAttr, at_risk: ["Fizyka"],
      absence_budget: absenceBudget, absence_budget_semester: 1,
      absence_budget_until: `${today.getFullYear() + (today.getMonth() >= 8 ? 1 : 0)}-01-31`,
      fewest_absences_left: -1, fewest_absences_left_subject: "Fizyka",
    }, 40.0);
    // New (ha-librus-synergia 0.6.0): gamification sensors - streaks and a
    // cosmetic rank tier. attendance_streak intentionally matches
    // last_absence_date above (18 days) so librus-streak-card's
    // dedicated-sensor path and its old attribute-fallback path would
    // agree if compared side by side.
    addEntity("sensor.attendance_streak", "attendance_streak", {}, 18);
    addEntity("sensor.behaviour_streak", "behaviour_streak", {}, 42);
    addEntity("sensor.good_grade_streak", "good_grade_streak", {}, 7);
    // Badges (made-up), the shape of the Rank sensor's `badges` attribute.
    const badge = (key, title, icon, tiers, earned, value = null, target = null, unit = null) =>
      ({ key, title, icon, tiers, earned, value, target, unit });
    const BADGES = [
      badge("first_six", "Pierwsza szóstka", "mdi:numeric-6-box", null, ["2026-09-12"]),
      badge("sixes", "Kolekcjoner szóstek", "mdi:star-shooting", [5, 10, 25], ["2026-09-29"], 7, null, "grades"),
      badge("good_grade_streak", "Seria dobrych ocen", "mdi:fire", [5, 10, 20], ["2026-09-18", "2026-10-03"], 12, null, "grades"),
      badge("hat_trick", "Hat-trick", "mdi:crown", null, [], 2, 3, "grades"),
      badge("test_ace", "Sprawdzian na 5+", "mdi:certificate", null, ["2026-10-08"]),
      badge("subject_star", "Prymus przedmiotu", "mdi:school", null, ["2026-10-06"], 5.62, 5.5, "average"),
      badge("honours", "Świadectwo z paskiem", "mdi:medal", null, [], 4.68, 4.75, "average"),
      badge("comeback", "Comeback", "mdi:arrow-up-bold-circle", null, []),
      badge("no_ones", "Semestr bez jedynki", "mdi:check-decagram", null, [], 39, 152, "days"),
      badge("attendance_streak", "Bez nieobecności", "mdi:calendar-check", [7, 30, 90], ["2026-09-09"], 24, null, "days"),
      badge("full_month", "100% w miesiącu", "mdi:calendar-star", null, ["2026-09-30"]),
      badge("punctual", "Punktualność", "mdi:clock-check-outline", null, [], 21, 30, "days"),
      badge("subject_attendance", "Wzorowa frekwencja z przedmiotu", "mdi:run-fast", null, ["2026-10-02"], 20, 20, "lessons"),
      badge("behaviour_streak", "Bez uwagi", "mdi:shield-star", [7, 30, 90], ["2026-09-08", "2026-10-01"], 38, null, "days"),
      badge("praise", "Pochwała", "mdi:thumb-up", null, ["2026-09-15"]),
      badge("praises", "Seria pochwał", "mdi:cards-playing-heart-multiple", [3, 5], [], 2, null, "notes"),
      badge("exemplary_behaviour", "Wzorowe zachowanie", "mdi:medal-outline", null, []),
      badge("lucky", "Szczęśliwy numerek", "mdi:clover", null, []),
      badge("homework", "Pracowitość", "mdi:checkbox-marked-circle-outline", [10, 25], [], 4, null, "tasks"),
      badge("school_year", "Rok ukończony", "mdi:flag-checkered", null, [], 39, 297, "days"),
    ];
    addEntity("sensor.rank", "rank", { average: 4.68, points_to_next_tier: 0.32, badges: BADGES }, "gold");
    // CONFIRMED live (2026-09-06): Librus can publish the NEXT school
    // day's number a day ahead - shown here exactly as observed live on
    // a Sunday (today has no school, "4" is actually Monday's number).
    addEntity("sensor.lucky_number", "lucky_number", {
      day: iso(new Date(today.getTime() + 1 * 86400000)),
      is_today: false,
    }, 4);
    // Weekly AI summary (integration 0.10+) - illustrative text from the
    // approved mockup, not a real student's data.
    const nextSunday = new Date(today.getTime() + ((7 - today.getDay()) % 7 || 7) * 86400000);
    nextSunday.setHours(18, 0, 0, 0);
    addEntity("sensor.weekly_summary", "weekly_summary", {
      status: "good",
      sections: {
        grades: { status: "good", text: "W tym tygodniu doszły 4 oceny: 5 z historii (sprawdzian, waga 3), 4 z biologii, 3+ z fizyki (kartkówka) i plus z plastyki. Średnia ogólna wzrosła z 4,30 do 4,38, głównie dzięki piątce z historii.\n\nFizyka (4,10) to jedyny przedmiot, w którym ostatnia ocena wypadła poniżej średniej. Przy jednej kartkówce to jeszcze nie trend, ale warto ją obserwować." },
        attendance: { status: "caution", text: "33 z 34 lekcji obecna. Jedna nieobecność w czwartek na muzyce, jeszcze nieusprawiedliwiona. Spóźnień brak." },
        behaviour: { status: "good", text: "Brak nowych uwag w tym tygodniu. 26 dni bez negatywnej uwagi i seria 5 ocen co najmniej dobrych z rzędu." },
        next_week: { status: "ok", text: "Wtorek 7.10: sprawdzian z matematyki (działy 1-2). Środa 8.10: zadanie z fizyki (s. 21). Czwartek 9.10: kartkówka z angielskiego. W piątek zastępstwo na WF." },
      },
      advice: [
        "Usprawiedliwić nieobecność z czwartku (muzyka).",
        "W niedzielę przejrzeć działy 1-2 z matematyki przed wtorkiem.",
        "Zapytać o kartkówkę z fizyki: nauczyciel wskazał błędy w jednostkach.",
      ],
      warning: "Nieobecność z czwartku (muzyka) jest wciąż nieusprawiedliwiona.",
      summary: null,
      week_from: iso(new Date(today.getTime() - 6 * 86400000)),
      week_to: iso(today),
      audience: "parent",
      generated_at: lastPolled,
      next_run: nextSunday.toISOString(),
      generating: false,
      paused: false,
      error: null,
      // "Parent and student" (integration 0.12.30+): the student's own text.
      versions: {
        student: {
          headline: "Piątka z historii to Twój tydzień - teraz matma we wtorek.",
          status: "good",
          sections: {
            grades: { status: "good", text: "Cztery nowe oceny, a piątka z historii podniosła Ci średnią do 4,38. Z fizyki wyszło 3+ - to jedna kartkówka, nic straconego." },
            next_week: { status: "ok", text: "Wtorek: sprawdzian z matematyki (działy 1-2). Czwartek: kartkówka z angielskiego." },
          },
          advice: ["Przejrzyj działy 1-2 z matematyki w weekend.", "Przypomnij rodzicom o usprawiedliwieniu z czwartku."],
          warning: null,
          summary: null,
        },

      const events = [];
      let hour = 8, min = 0;

        const end = new Date(start.getTime() + 45 * 60000);
        events.push({
          start: start.toISOString(), end: end.toISOString(), allDay: false,
          summary: LESSON_SUBJECTS[(i + day.getDay()) % LESSON_SUBJECTS.length],
          location: `sala ${10 + i}`, description: "Nauczyciel " + String.fromCharCode(65 + i),
        });
        min += 55; if (min >= 60) { min -= 60; hour += 1; }
      }
      return events;
    }

    // own `mondayOf()` exactly, so its Mon-Fri query range actually finds
    // these mock events regardless of which real weekday this harness
    // happens to be opened on.
    const isoWeekdayOf = (d) => { const w = d.getDay(); return w === 0 ? 7 : w; };

    const WEEK_SHAPE = [[1, 5], [2, 4], [1, 4], [2, 3], [1, 3]];
    function buildBellDayEvents(day, first, count) {
      return bellSlots.slice(first - 1, first - 1 + count).map((slot, i) => {
        const start = new Date(day); start.setHours(slot.start.getHours(), slot.start.getMinutes(), 0, 0);

        return {
          start: start.toISOString(), end: end.toISOString(), allDay: false,
          summary: LESSON_SUBJECTS[(i + first + day.getDay()) % LESSON_SUBJECTS.length],

    const tomorrowCovered = tomorrowDay.getTime() < weekMonday.getTime() + 12 * 86400000; // this + next week

        JSON.stringify([
          { id: "wszechstronny", when: iso(new Date(today.getTime() - 21 * 86400000)) },
          { id: "wojownik", when: iso(new Date(today.getTime() - 9 * 86400000)) },
        ])
      );
    } catch {}

    import("../dist/librus-synergia-cards.js").then(() => {
      const fullGrid = document.getElementById("full");
      const cardEls = [];
      for (const entry of FULL_CARDS) {
        const tag = typeof entry === "string" ? entry : entry.tag;
        const config = typeof entry === "string" ? undefined : entry.config;
        cardEls.push(mountCard(fullGrid, tag, entry.family ? familyHass : hass, config));
      }

      const emptyGrid = document.getElementById("empty");
      const emptyEls = [];
      for (const entry of FULL_CARDS) {
        const tag = typeof entry === "string" ? entry : entry.tag;
        const config = typeof entry === "string" ? undefined : entry.config;
        emptyEls.push(mountCard(emptyGrid, tag, emptyHass, config));
      }

      document.getElementById("toggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        hass.themes.darkMode = document.body.classList.contains("dark");
        emptyHass.themes.darkMode = hass.themes.darkMode;
        [...cardEls, ...emptyEls].forEach((el) => { el.hass = { ...el.hass, themes: { darkMode: hass.themes.darkMode } }; });
      });
      let outage = false;
      document.getElementById("outage").addEventListener("click", (e) => {
        outage = !outage;
        e.target.textContent = outage ? "Librus znowu działa" : "Symuluj awarię Librusa";
        const since = outage ? new Date(Date.now() - 260 * 60_000).toISOString() : new Date().toISOString();
        const next = new Date(Date.now() + 40 * 60_000).toISOString();
        // A new states object with new state objects, like Home Assistant -
        // the cards only re-render when one of their entities' objects changed.
        hass.states = {
          ...hass.states,
          "sensor.status": {
            ...hass.states["sensor.status"],
            state: outage ? "stale" : "ok",
            attributes: { ...hass.states["sensor.status"].attributes, data_source: outage ? "stale" : "live", last_success: since, failures: outage ? 3 : 0, next_attempt: outage ? next : null },
          },
          "sensor.last_update": { ...hass.states["sensor.last_update"], state: since },
        };
        cardEls.forEach((el) => { el.hass = { ...el.hass, states: hass.states }; });
      });
      document.getElementById("lang").addEventListener("change", (e) => {
        hass.language = e.target.value;
        emptyHass.language = e.target.value;
        cardEls.forEach((el) => { el.hass = { ...el.hass, language: e.target.value }; });
      });
    });
  </script>
</body>
</html>
